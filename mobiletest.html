<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Taurus Control - Asistente Cora</title>
  
  <style>
    /* Estilos generales para simular tu app */
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f7f6;
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .tarjeta {
      background: white;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.05);
    }
    h2 { margin-top: 0; font-size: 18px; color: #2b5876; }
    
    /* Historial de eventos visuales */
    #registro-actividad {
      list-style: none;
      padding: 0;
      margin: 0;
    }
    #registro-actividad li {
      padding: 10px;
      border-bottom: 1px solid #eee;
      font-size: 14px;
    }
    #registro-actividad li:last-child { border-bottom: none; }
    .badge {
      background: #4e4376;
      color: white;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 12px;
      margin-right: 10px;
    }

    /* EL AURA (BOTÓN FLOTANTE ESTILO SIRI) */
    #btn-aura {
      position: fixed;
      bottom: 30px;
      right: 30px;
      width: 65px;
      height: 65px;
      border-radius: 50%;
      background: linear-gradient(135deg, #2b5876 0%, #4e4376 100%);
      box-shadow: 0 0 15px rgba(78, 67, 118, 0.6), inset 0 0 10px rgba(255,255,255,0.3);
      border: none;
      cursor: pointer;
      z-index: 9999;
      animation: respirar 3s infinite alternate;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      -webkit-tap-highlight-color: transparent;
    }
    @keyframes respirar {
      0% { transform: scale(1); box-shadow: 0 0 15px rgba(78, 67, 118, 0.5); }
      100% { transform: scale(1.08); box-shadow: 0 0 30px rgba(78, 67, 118, 0.9); }
    }
    #btn-aura.escuchando {
      background: linear-gradient(135deg, #f12711 0%, #f5af19 100%);
      animation: latir 0.8s infinite alternate;
    }
    @keyframes latir {
      0% { transform: scale(1); box-shadow: 0 0 15px rgba(241, 39, 17, 0.6); }
      100% { transform: scale(1.15); box-shadow: 0 0 35px rgba(245, 175, 25, 0.9); }
    }
    .icono-mic {
      width: 28px;
      height: 28px;
      fill: currentColor;
    }

    /* Estado de la IA Flotante */
    #estado-ia {
      position: fixed;
      bottom: 110px;
      right: 30px;
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 10px 15px;
      border-radius: 12px;
      font-size: 14px;
      display: none;
      z-index: 9998;
      backdrop-filter: blur(5px);
    }
  </style>
</head>
<body>

  <!-- UI de demostración de tu App -->
  <div class="tarjeta">
    <h2>Últimos Movimientos en la Manga</h2>
    <ul id="registro-actividad">
      <li><span class="badge">Sistema</span> App Taurus Control iniciada y lista.</li>
    </ul>
  </div>

  <!-- Componentes de la IA (Cora) -->
  <button id="btn-aura">
    <svg class="icono-mic" viewBox="0 0 24 24">
      <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3zm5-3c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
    </svg>
  </button>
  <div id="estado-ia"></div>

  <script>
    // --- VARIABLES Y CONFIGURACIÓN ---
    const URL_APPS_SCRIPT = 'PON_AQUI_LA_URL_DE_TU_APPS_SCRIPT'; // REEMPLAZAR
    const btnAura = document.getElementById('btn-aura');
    const estadoIA = document.getElementById('estado-ia');
    const registroActividad = document.getElementById('registro-actividad');
    let audioDesbloqueado = false;
    let vocesDisponibles = [];

    // --- CARGAR VOCES PREMIUM (CORA) ---
    function cargarVoces() {
      vocesDisponibles = window.speechSynthesis.getVoices();
    }
    if (speechSynthesis.onvoiceschanged !== undefined) {
      speechSynthesis.onvoiceschanged = cargarVoces;
    }

    // --- MOTOR DE VOZ ---
    function hablarIA(texto) {
      window.speechSynthesis.cancel(); // Fix crítico para iOS (corta audios trabados)
      const utterance = new SpeechSynthesisUtterance(texto);
      utterance.lang = 'es-ES'; 
      utterance.rate = 1.05; 
      
      // Busca la mejor voz femenina en español (Cora)
      let vozElegida = vocesDisponibles.find(v => v.lang.startsWith('es') && v.name.includes('Premium')) ||
                       vocesDisponibles.find(v => v.lang.startsWith('es') && v.name.includes('Enhanced')) ||
                       vocesDisponibles.find(v => v.lang === 'es-MX') ||
                       vocesDisponibles.find(v => v.lang.startsWith('es'));
      
      if (vozElegida) utterance.voice = vozElegida;
      window.speechSynthesis.speak(utterance);
    }

    // --- MOTOR DE DICTADO ---
    const ReconocimientoVoz = window.SpeechRecognition || window.webkitSpeechRecognition;
    let reconocimiento;
    
    if (ReconocimientoVoz) {
      reconocimiento = new ReconocimientoVoz();
      reconocimiento.lang = 'es-ES';
      reconocimiento.interimResults = false;

      reconocimiento.onstart = () => {
        btnAura.classList.add('escuchando');
        estadoIA.style.display = 'block';
        estadoIA.innerText = 'Cora te escucha...';
      };

      reconocimiento.onresult = (evento) => {
        btnAura.classList.remove('escuchando');
        const mensaje = evento.results[0][0].transcript;
        estadoIA.innerText = 'Pensando...';
        enviarAlBackend(mensaje); 
      };

      reconocimiento.onerror = (e) => {
        btnAura.classList.remove('escuchando');
        estadoIA.innerText = 'No pude escucharte bien.';
        setTimeout(() => estadoIA.style.display = 'none', 3000);
      };
    } else {
      alert("Tu navegador no soporta dictado por voz.");
    }

    // --- INTERACCIÓN CON EL AURA ---
    btnAura.addEventListener('click', () => {
      // Parche estricto para Safari en iPhone (Desbloqueo de Audio)
      if (!audioDesbloqueado) {
        let silencio = new SpeechSynthesisUtterance('');
        silencio.volume = 0;
        window.speechSynthesis.speak(silencio);
        audioDesbloqueado = true;
      }
      
      try {
        reconocimiento.start();
      } catch(e) {
        reconocimiento.stop();
      }
    });

    // --- CONEXIÓN AL BACKEND (APPS SCRIPT) ---
    function enviarAlBackend(mensajeUsuario) {
      fetch(URL_APPS_SCRIPT, {
        method: 'POST',
        body: JSON.stringify({ accion: 'ia', mensaje: mensajeUsuario })
      })
      .then(r => r.json())
      .then(datos => {
        if(datos.status === 'ok') {
          estadoIA.style.display = 'none';
          
          // 1. Cora habla la respuesta natural ("Listo, caravana 123 vacunada")
          hablarIA(datos.respuesta);
          
          // 2. Aquí está la magia: La app verifica si la IA devolvió una ACCIÓN a ejecutar
          if(datos.comando_accion) {
            ejecutarAccionEnApp(datos.comando_accion, datos.parametros);
          }
        } else {
          estadoIA.innerText = 'Error de conexión';
          setTimeout(() => estadoIA.style.display = 'none', 3000);
        }
      })
      .catch(e => {
        estadoIA.innerText = 'Error de red';
        setTimeout(() => estadoIA.style.display = 'none', 3000);
      });
    }

    // --- EL CEREBRO DE TU APP (TUS FUNCIONES) ---
    // Esta función recibe las órdenes de la IA y actualiza tu sistema visualmente.
    function ejecutarAccionEnApp(accion, params) {
      const li = document.createElement('li');
      
      if (accion === 'registrar_sanidad') {
        li.innerHTML = `<span class="badge">Sanidad</span> Caravana: <b>${params.caravana}</b> - Aplicado: ${params.tratamiento}`;
        // Aquí llamarías a tu función real para guardar en Google Sheets o tu Base de Datos.
        // guardarEnBaseDeDatos(params.caravana, 'sanidad', params.tratamiento);
      } 
      else if (accion === 'registrar_peso') {
        li.innerHTML = `<span class="badge">Pesaje</span> Caravana: <b>${params.caravana}</b> - Nuevo peso: ${params.peso}kg`;
      }
      else if (accion === 'reporte_prenadas') {
        li.innerHTML = `<span class="badge">Reporte</span> Consultando total de vientres preñados en el sistema...`;
      }
      
      // Agrega el registro a la parte superior de la lista visual
      registroActividad.prepend(li);
    }
  </script>
</body>
</html>
