<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Taurus Control - Móvil</title>
    <meta name="theme-color" content="#0f172a">
    <link rel="icon" type="image/png" href="gemini-svg.png">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.31/jspdf.plugin.autotable.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore-compat.js"></script>
    <style>
        :root { --primario: #0f172a; --secundario: #3b82f6; --exito: #10b981; --alerta: #f59e0b; --peligro: #ef4444; --borde: #334155; --texto: #f8fafc; --muted: #94a3b8; }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; color: var(--texto); background: #1e293b; min-height: 100vh; overflow-x: hidden; }
        .oculto { display: none !important; }
        #pantalla-login { display: flex; align-items: center; justify-content: center; height: 100vh; width: 100%; flex-direction: column; background: var(--primario); position: fixed; top:0; left:0; z-index:9999;}
        .login-contenedor { background: #1e293b; border-radius: 16px; padding: 40px 30px; width: 90%; max-width: 360px; text-align: center; border: 1px solid var(--borde);}
        .form-control-login { width: 100%; padding: 15px; border: 1px solid var(--borde); border-radius: 8px; font-size: 16px; margin-bottom: 15px; background: #0f172a; color: var(--texto); outline: none;}
        .btn-ingresar { width: 100%; background: var(--secundario); color: white; border: none; padding: 15px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer;}
        .cabecera { background-color: #0f172a; color: var(--texto); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--borde); position: sticky; top: 0; z-index: 100;}
        .contenedor { padding: 15px; max-width: 800px; margin: 0 auto; }
        .tarjeta { background: #0f172a; border-radius: 12px; padding: 20px; margin-bottom: 20px; border: 1px solid var(--borde); }
        .grid-kpis { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; margin-bottom: 20px; }
        .kpi-caja { background: #1e293b; padding: 15px; border-radius: 12px; text-align: center; border: 1px solid var(--borde); }
        .kpi-valor { font-size: 24px; font-weight: bold; color: var(--secundario); }
        .nav-inferior { position: fixed; bottom: 0; left: 0; width: 100%; background: #0f172a; display: flex; justify-content: space-around; padding: 12px 0; border-top: 1px solid var(--borde); z-index: 100;}
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--muted); font-size: 10px; font-weight: bold; cursor: pointer;}
        .nav-item.activo { color: var(--secundario); }
        
        /* BOTÓN CORA */
        #btn-aura {
            position: fixed; bottom: 80px; right: 20px; width: 65px; height: 65px; border-radius: 50%;
            background: linear-gradient(135deg, #0f172a 0%, #3b82f6 100%);
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.6); border: 2px solid var(--borde);
            display: none; align-items: center; justify-content: center; z-index: 9999; cursor: pointer; touch-action: none;
        }
        #btn-aura.escuchando { background: linear-gradient(135deg, #10b981 0%, #3b82f6 100%); animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
        #estado-ia { position: fixed; bottom: 155px; right: 20px; background: rgba(15, 23, 42, 0.9); color: white; padding: 8px 15px; border-radius: 20px; font-size: 12px; display: none; z-index: 9998; border: 1px solid var(--borde); }
    </style>
</head>
<body>

    <div id="pantalla-login">
        <div class="login-contenedor">
            <img src="gemini-svg.png" width="80" style="margin-bottom:20px;">
            <div style="font-size:22px; font-weight:900; margin-bottom:20px;">Taurus Control</div>
            <input type="text" id="usuario" class="form-control-login" placeholder="Usuario">
            <input type="password" id="password" class="form-control-login" placeholder="Contraseña">
            <button class="btn-ingresar" onclick="procesarIngreso()">Entrar</button>
        </div>
    </div>

    <div id="pantalla-app" class="oculto">
        <header class="cabecera">
            <div style="font-weight:bold; font-size:18px;">TAURUS</div>
            <div id="estado-red" style="font-size:12px; color:var(--exito);">🟢 Conectado</div>
        </header>

        <div class="contenedor">
            <div id="vista-dashboard" class="vista">
                <div class="grid-kpis">
                    <div class="kpi-caja"><div class="kpi-valor" id="dash-cabezas">0</div><div style="font-size:10px;">CABEZAS</div></div>
                    <div class="kpi-caja"><div class="kpi-valor" id="dash-bajas" style="color:var(--peligro);">0</div><div style="font-size:10px;">BAJAS</div></div>
                </div>
                <div class="tarjeta">Resumen de Hacienda</div>
            </div>

            <div id="vista-manga" class="vista oculto">
                <div class="tarjeta">
                    <input type="text" id="buscador-caravana" class="form-control-login" placeholder="Nº Caravana" style="margin-bottom:10px;">
                    <button class="btn-ingresar" onclick="buscarCaravanaBtn()">Buscar RP</button>
                </div>
                <div id="ficha-animal" class="tarjeta oculto">
                    <h2 id="val-caravana" style="text-align:center; font-size:30px; margin:0;">---</h2>
                    <div id="val-peso" style="text-align:center; color:var(--secundario); font-weight:bold; margin-bottom:20px;">- Kg</div>
                    <button class="btn-ingresar" style="background:var(--exito);" onclick="abrirModal('modal-accion')">Registrar Trabajo</button>
                </div>
            </div>

            <div id="vista-registro" class="vista oculto">
                <div class="tarjeta">
                    <div style="font-weight:bold; margin-bottom:10px;">Inventario</div>
                    <div id="tb-registro"></div>
                </div>
            </div>

            <div id="vista-informe" class="vista oculto">
                <div class="tarjeta">
                    <button class="btn-ingresar" onclick="ejecutarDescargaPDF()">Descargar Inventario PDF</button>
                </div>
            </div>
        </div>

        <nav class="nav-inferior">
            <div class="nav-item activo" onclick="cambiarVista('vista-dashboard', this)">📊 Panel</div>
            <div class="nav-item" onclick="cambiarVista('vista-manga', this)">🐄 Manga</div>
            <div class="nav-item" onclick="cambiarVista('vista-registro', this)">📋 Buscar</div>
            <div class="nav-item" onclick="cambiarVista('vista-informe', this)">📄 Reportes</div>
        </nav>
    </div>

    <button id="btn-aura">
        <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="23"></line><line x1="8" y1="23" x2="16" y2="23"></line></svg>
    </button>
    <div id="estado-ia">Cora lista</div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyDTXUYwYYkQ_pKDhui9H3cFmecgAPQ9eqA", authDomain: "taurus-cbd59.firebaseapp.com", projectId: "taurus-cbd59", storageBucket: "taurus-cbd59.firebasestorage.app", messagingSenderId: "250280835981", appId: "1:250280835981:web:b95bc0a7ec9f7da2b75bc4" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        let dbCache = []; let rpActivo = null; let usNombre = ""; let usRol = ""; let usHacienda = ""; let maestroId = "";
        let coraHistorial = [];

        // --- INICIO DE SISTEMA ---
        firebase.auth().onAuthStateChanged(user => {
            if (user) {
                db.collection('usuarios').doc(user.email).get().then(doc => {
                    const d = doc.data();
                    usNombre = d.nombre; usRol = d.rol; usHacienda = d.hacienda; maestroId = d.maestroId;
                    
                    // Visibilidad Cora
                    if (String(d.rol).includes('Propietario') || String(d.features).includes('cora')) {
                        document.getElementById('btn-aura').style.display = 'flex';
                    }

                    db.collection('estancias').doc(maestroId).collection('eventos').onSnapshot(snap => {
                        dbCache = []; snap.forEach(doc => dbCache.push(doc.data()));
                        actualizarDashboard();
                    });

                    document.getElementById('pantalla-login').classList.add('oculto');
                    document.getElementById('pantalla-app').classList.remove('oculto');
                });
            }
        });

        function procesarIngreso() {
            const u = document.getElementById('usuario').value.trim().toLowerCase();
            const p = document.getElementById('password').value;
            const email = u.includes('@') ? u : u + "@taurus.com";
            firebase.auth().signInWithEmailAndPassword(email, p).catch(e => alert("Error: " + e.message));
        }

        function cambiarVista(v, b) {
            document.querySelectorAll('.vista').forEach(e => e.classList.add('oculto'));
            document.getElementById(v).classList.remove('oculto');
            document.querySelectorAll('.nav-item').forEach(e => e.classList.remove('activo'));
            if(b) b.classList.add('activo');
        }

        function actualizarDashboard() {
            const unicas = [...new Set(dbCache.map(d => d.caravana))].filter(c => c !== "---");
            document.getElementById('dash-cabezas').innerText = unicas.length;
            document.getElementById('dash-bajas').innerText = dbCache.filter(d => d.accion === 'Baja').length;
        }

        function buscarCaravanaBtn(rpManual) {
            const rp = rpManual || document.getElementById('buscador-caravana').value.trim();
            if (!rp) return;
            rpActivo = rp;
            document.getElementById('val-caravana').innerText = rp;
            const ultPeso = dbCache.filter(d => d.caravana === rp && d.accion === 'Peso').sort((a,b) => new Date(b.fecha) - new Date(a.fecha))[0];
            document.getElementById('val-peso').innerText = ultPeso ? ultPeso.valor : "- Kg";
            document.getElementById('ficha-animal').classList.remove('oculto');
            cambiarVista('vista-manga', document.querySelectorAll('.nav-item')[1]);
        }

        function ejecutarAccion(tipo, val, det, rp) {
            const target = rp || rpActivo;
            if(!target) return;
            const obj = { fecha: new Date().toISOString(), accion: tipo, caravana: target, valor: val, detalles: det, maestro: maestroId };
            db.collection('estancias').doc(maestroId).collection('eventos').add(obj);
        }

        function ejecutarDescargaPDF() { alert("Generando PDF..."); }

        // ==========================================
        // CORA IA: ESTABILIDAD Y MANOS LIBRES
        // ==========================================
        const btnAura = document.getElementById('btn-aura');
        const estadoIA = document.getElementById('estado-ia');
        let isListening = false;
        let isDragging = false;
        let dragStartX, dragStartY;

        // 1. Gestión de Eventos (Drag vs Click)
        btnAura.addEventListener('touchstart', e => {
            isDragging = false;
            dragStartX = e.touches[0].clientX;
            dragStartY = e.touches[0].clientY;
        }, {passive: true});

        btnAura.addEventListener('touchmove', e => {
            const moveX = e.touches[0].clientX - dragStartX;
            const moveY = e.touches[0].clientY - dragStartY;
            if (Math.abs(moveX) > 10 || Math.abs(moveY) > 10) {
                isDragging = true;
                btnAura.style.left = (e.touches[0].clientX - 32) + 'px';
                btnAura.style.top = (e.touches[0].clientY - 32) + 'px';
                btnAura.style.right = 'auto'; btnAura.style.bottom = 'auto';
            }
        }, {passive: false});

        btnAura.addEventListener('touchend', () => {
            if (!isDragging) toggleMic();
            isDragging = false;
        });

        // 2. Ciclo de Vida del Micrófono
        const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        const recognition = SpeechRecognition ? new SpeechRecognition() : null;

        if (recognition) {
            recognition.lang = 'es-ES';
            recognition.continuous = false; // Mejor para comandos precisos
            recognition.interimResults = false;

            recognition.onstart = () => {
                isListening = true;
                btnAura.classList.add('escuchando');
                estadoIA.innerText = "Cora escuchando...";
                estadoIA.style.display = 'block';
            };

            recognition.onend = () => {
                isListening = false;
                btnAura.classList.remove('escuchando');
                if (estadoIA.innerText === "Cora escuchando...") estadoIA.style.display = 'none';
            };

            recognition.onerror = (e) => {
                console.error("Error Mic:", e.error);
                isListening = false;
                btnAura.classList.remove('escuchando');
                estadoIA.style.display = 'none';
            };

            recognition.onresult = (e) => {
                const transcript = e.results[0][0].transcript;
                enviarComandoACora(transcript);
            };
        }

        function toggleMic() {
            if (!recognition) return alert("Voz no soportada");
            if (isListening) recognition.stop(); else recognition.start();
        }

        // 3. Llamada al Servidor con Manejo de Errores
        async function enviarComandoACora(msg) {
            estadoIA.innerText = "Cora pensando...";
            estadoIA.style.display = 'block';
            
            const payload = {
                accion: 'ia', mensaje: msg, nombreUsuario: usNombre, rolUsuario: usRol, haciendaNombre: usHacienda,
                contexto: {
                    cabezasVivas: document.getElementById('dash-cabezas').innerText,
                    bajasMortalidad: document.getElementById('dash-bajas').innerText,
                    rpActualEnPantalla: rpActivo || "Ninguno",
                    horaLocal: new Date().toLocaleTimeString(),
                    historial: coraHistorial.join(" | ")
                }
            };

            try {
                const response = await fetch('https://script.google.com/macros/s/AKfycbyt8VbPIc_-0LKbleRiPutWErESZ8gmxSpGXDIo1WXbAciE7J0Sy5YGjYU_O39ZFM-25A/exec', {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                
                if (data.respuesta) {
                    coraHistorial.push("U: " + msg);
                    coraHistorial.push("C: " + data.respuesta);
                    if (coraHistorial.length > 6) coraHistorial.shift();
                    
                    // Feedback de voz (opcional)
                    const synth = window.speechSynthesis;
                    const utter = new SpeechSynthesisUtterance(data.respuesta);
                    utter.lang = 'es-ES';
                    synth.speak(utter);

                    if (data.comando) ejecutarComandoEnApp(data.comando, data.parametros);
                }
            } catch (err) {
                console.error("Error Cora:", err);
                estadoIA.innerText = "Error de conexión";
                setTimeout(() => estadoIA.style.display = 'none', 2000);
            } finally {
                if (!isListening) setTimeout(() => { estadoIA.style.display = 'none'; }, 3000);
            }
        }

        // 4. Mapeo Manos Libres Total
        function ejecutarComandoEnApp(cmd, p) {
            try {
                switch(cmd) {
                    case 'navegar':
                        const vistas = { 'dashboard': 0, 'manga': 1, 'registro': 2, 'informe': 3 };
                        cambiarVista('vista-' + p.vista, document.querySelectorAll('.nav-item')[vistas[p.vista]]);
                        break;
                    case 'buscar_caravana':
                        buscarCaravanaBtn(p.rp);
                        break;
                    case 'accion_ganadera':
                        ejecutarAccion(p.tipo, p.valor, p.detalles || "Vía Cora", p.rp);
                        if(p.rp) buscarCaravanaBtn(p.rp);
                        break;
                    case 'filtrar_registro':
                        cambiarVista('vista-registro', document.querySelectorAll('.nav-item')[2]);
                        // Lógica de filtrado visual aquí
                        break;
                    case 'generar_informe':
                        cambiarVista('vista-informe', document.querySelectorAll('.nav-item')[3]);
                        ejecutarDescargaPDF();
                        break;
                    case 'crear_operador':
                        alert("Creando usuario: " + p.nombre);
                        break;
                }
            } catch(e) { console.error("Error comando:", e); }
        }
    </script>
</body>
</html>
